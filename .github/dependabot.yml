version: 2
updates:
  # Actions do GitHub: mensal e agrupado, para nao gerar enxurrada de PRs (TaskHub #205094)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    # Quarentena: nao propor versao publicada ha menos de 14 dias (TaskHub #203769).
    # Atualizacao de seguranca ignora o cooldown.
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore"
      include: "scope"
